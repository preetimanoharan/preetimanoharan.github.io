<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f242e" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    
    <linearGradient id="pbiYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f2c811" />
      <stop offset="100%" stop-color="#d4af0c" />
    </linearGradient>

    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#118ab2" />
      <stop offset="100%" stop-color="#06d6a0" />
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="800" height="500" rx="12" fill="url(#bgGrad)" />
  
  <g id="window-header">
    <circle cx="25" cy="25" r="6" fill="#ff5f56" />
    <circle cx="45" cy="25" r="6" fill="#ffbd2e" />
    <circle cx="65" cy="25" r="6" fill="#27c93f" />
    <text x="400" y="30" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1">sales_performance_dashboard.pbix</text>
  </g>

  <g id="sidebar" transform="translate(0, 50)">
    <rect width="50" height="450" fill="#161b22" />
    <rect x="15" y="20" width="20" height="20" rx="4" fill="#f2c811" opacity="0.8" />
    <circle cx="25" cy="75" r="10" fill="#8b949e" opacity="0.3" />
    <path d="M15 115 L25 125 L35 115" stroke="#8b949e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.3"/>
    <rect x="15" y="150" width="20" height="6" rx="2" fill="#8b949e" opacity="0.3" />
    <rect x="15" y="162" width="20" height="6" rx="2" fill="#8b949e" opacity="0.3" />
  </g>

  <g id="main-canvas" transform="translate(50, 50)">
    
    <g id="ribbon">
      <rect width="750" height="40" fill="#161b22" />
      <text x="20" y="25" fill="#c9d1d9" font-family="Segoe UI, sans-serif" font-size="13" font-weight="500">File  |  View  |  Data  |  Drill down</text>
      <rect x="630" y="8" width="100" height="24" rx="4" fill="#21262d" stroke="#30363d" />
      <text x="680" y="24" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">Filter: All Time</text>
    </g>

    <g id="kpi-card-1" transform="translate(20, 60)" filter="url(#dropShadow)">
      <rect width="220" height="90" rx="8" fill="#21262d" />
      <text x="20" y="30" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">TOTAL REVENUE</text>
      <text x="20" y="65" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="28" font-weight="bold">$24.8M</text>
      <text x="140" y="62" fill="#06d6a0" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">▲ 12.3%</text>
    </g>

    <g id="kpi-card-2" transform="translate(265, 60)" filter="url(#dropShadow)">
      <rect width="220" height="90" rx="8" fill="#21262d" />
      <text x="20" y="30" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">ACTIVE CLIENTS</text>
      <text x="20" y="65" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="28" font-weight="bold">1,842</text>
      <text x="140" y="62" fill="#06d6a0" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">▲ 4.7%</text>
    </g>

    <g id="kpi-card-3" transform="translate(510, 60)" filter="url(#dropShadow)">
      <rect width="220" height="90" rx="8" fill="#21262d" />
      <text x="20" y="30" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">TARGET Q2</text>
      <text x="20" y="65" fill="#f2c811" font-family="Segoe UI, sans-serif" font-size="28" font-weight="bold">85%</text>
      
      <circle cx="165" cy="50" r="25" fill="none" stroke="#30363d" stroke-width="6" />
      <circle cx="165" cy="50" r="25" fill="none" stroke="url(#pbiYellow)" stroke-width="6" 
              stroke-dasharray="157" stroke-dashoffset="30" stroke-linecap="round" transform="rotate(-90, 165, 50)" />
    </g>

    <g id="bar-chart" transform="translate(20, 170)" filter="url(#dropShadow)">
      <rect width="340" height="250" rx="8" fill="#21262d" />
      <text x="20" y="30" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600">Sales by Product Category</text>
      
      <g transform="translate(20, 50)" opacity="0.8">
        <line x1="50" y1="20" x2="50" y2="160" stroke="#30363d" stroke-width="2" />
        <line x1="50" y1="160" x2="300" y2="160" stroke="#30363d" stroke-width="2" />
        
        <text x="40" y="45" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="end">Tech</text>
        <rect x="51" y="30" width="180" height="22" rx="3" fill="url(#pbiYellow)" />
        
        <text x="40" y="85" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="end">Office</text>
        <rect x="51" y="70" width="130" height="22" rx="3" fill="#118ab2" />
        
        <text x="40" y="125" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="end">Furn.</text>
        <rect x="51" y="110" width="90" height="22" rx="3" fill="#06d6a0" />
        
        <text x="50" y="180" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="10" text-anchor="middle">0</text>
        <text x="140" y="180" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="10" text-anchor="middle">5M</text>
        <text x="230" y="180" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="10" text-anchor="middle">10M</text>
      </g>
    </g>

    <g id="line-chart" transform="translate(390, 170)" filter="url(#dropShadow)">
      <rect width="340" height="250" rx="8" fill="#21262d" />
      <text x="20" y="30" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600">Monthly Revenue Trend</text>
      
      <g transform="translate(20, 50)">
        <line x1="30" y1="40" x2="310" y2="40" stroke="#30363d" stroke-width="1" stroke-dasharray="4" />
        <line x1="30" y1="90" x2="310" y2="90" stroke="#30363d" stroke-width="1" stroke-dasharray="4" />
        <line x1="30" y1="140" x2="310" y2="140" stroke="#30363d" stroke-width="1" stroke-dasharray="4" />
        <line x1="30" y1="160" x2="310" y2="160" stroke="#30363d" stroke-width="2" />
        
        <path d="M30 130 Q 75 70, 120 100 T 210 50 T 310 30" fill="none" stroke="url(#accentBlue)" stroke-width="4" stroke-linecap="round"/>
        
        <circle cx="30" cy="130" r="5" fill="#118ab2" stroke="#21262d" stroke-width="2" />
        <circle cx="120" cy="100" r="5" fill="#118ab2" stroke="#21262d" stroke-width="2" />
        <circle cx="210" cy="50" r="5" fill="#06d6a0" stroke="#21262d" stroke-width="2" />
        <circle cx="310" cy="30" r="5" fill="#06d6a0" stroke="#21262d" stroke-width="2" />

        <g transform="translate(170, 15)">
          <rect x="0" y="0" width="75" height="30" rx="4" fill="#161b22" stroke="#f2c811" stroke-width="1"/>
          <text x="37" y="18" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Peak: $4.2M</text>
        </g>
        
        <text x="20" y="43" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="10" text-anchor="end">5M</text>
        <text x="20" y="93" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="10" text-anchor="end">2.5M</text>
        
        <text x="30" y="180" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="10" text-anchor="middle">Jan</text>
        <text x="120" y="180" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="10" text-anchor="middle">Feb</text>
        <text x="210" y="180" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="10" text-anchor="middle">Mar</text>
        <text x="310" y="180" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="10" text-anchor="middle">Apr</text>
      </g>
    </g>
  </g>
</svg>

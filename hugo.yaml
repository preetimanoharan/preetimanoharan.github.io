    enable: true
    title: "Education"
    items:
      - title: "MBA"
        school:
          name: "Indian Institute of Management Tiruchirappalli"
          url: "https://www.iimtrichy.ac.in/"
        date: "2016 - 2018"
        content: |
          - Specialized in Finance and Business Strategy.
          - Member of PlaceCom

      - title: "Chartered Accountancy"
        school:
          name: "Institute of Chartered Accountants of India"
          url: "https://www.icai.org/"
        date: "2009 - 2014"
        content: |
          - Cleared rigorous multi-tiered professional competency examinations.
          - Mumbai, India

      - title: "Bachelor of Management Studies"
        school:
          name: "Mumbai University"
          url: "https://mu.ac.in/"
        date: "2009 - 2012"
        content: |
          - Graduated with a focus on core management principles and corporate finance.
          - Mumbai, India

